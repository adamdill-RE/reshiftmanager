; Match the production runtime measured on 2026-08-23 (docs/hosting.md), so a
; limit that will be hit on the server is hit locally first.

memory_limit = 128M
max_execution_time = 30
post_max_size = 8M
upload_max_filesize = 2M

; The trap worth reproducing: PHP truncates beyond this SILENTLY. A bulk form
; posting all 98 positions at once exceeds it and simply loses fields, with no
; error anywhere.
max_input_vars = 1000

date.timezone = UTC
default_charset = UTF-8

; The 90-day "keep me signed in" cannot be a PHP session at this lifetime.
session.gc_maxlifetime = 1440

; On the server these are off/on respectively and errors go to a log file;
; locally the app turns display_errors back on via RESM_DEBUG.
display_errors = Off
log_errors = On

opcache.enable = 0
