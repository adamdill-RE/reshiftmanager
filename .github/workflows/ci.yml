name: CI

# There is no staging copy of this application: a bad migration is discovered
# on the live site, during a shift, with 25-100 people on the tarmac. So the
# suite runs against the same MariaDB major version the server runs, on the
# same PHP version, on every push.
on:
  # pull_request covers every feature branch. push is limited to the trunk, so
  # a commit on a branch with an open PR runs the job once rather than twice —
  # the same checks reported under two identical names is noise when you are
  # reading a PR's status.
  push:
    branches:
      - claude/rodeo-express-init-6owg3p
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (${{ matrix.db.name }})

    # Both engines, because we do not know which one the server runs. cPanel's
    # Server Information reports the database on the WEB server, and this
    # account's database is on separate hardware, so that reading says nothing
    # about the engine the application actually talks to.
    #
    # This is not hypothetical. The schema used STORED generated columns, which
    # MariaDB accepts alongside ON DELETE CASCADE and MySQL rejects outright
    # with error 1215. A MariaDB-only pipeline passed it straight through to a
    # server that could not create the table.
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: MariaDB 10.11
            image: mariadb:10.11
          - name: MySQL 8.0
            image: mysql:8.0

    services:
      db:
        image: ${{ matrix.db.image }}
        # Each image reads its own prefix and ignores the other's, so one block
        # configures both.
        env:
          MARIADB_DATABASE: resm
          MARIADB_USER: resm
          MARIADB_PASSWORD: resm_dev
          MARIADB_ROOT_PASSWORD: root_dev
          MYSQL_DATABASE: resm
          MYSQL_USER: resm
          MYSQL_PASSWORD: resm_dev
          MYSQL_ROOT_PASSWORD: root_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      RESM_DB_HOST: 127.0.0.1
      RESM_DB_PORT: 3306
      RESM_DB_NAME: resm
      RESM_DB_USER: resm
      RESM_DB_PASS: resm_dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Production is 8.2.33. Testing on a newer PHP would hide a syntax or
          # deprecation problem until it reached the server.
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none
          # The application has no Composer dependencies by design (CLAUDE.md),
          # so there is nothing to install and nothing to cache.
          tools: none

      - name: Check the deployment manifest
        run: |
          set -euo pipefail
          # .cpanel.yml is parsed by the host, not by us, and a file it rejects
          # disables deployment entirely rather than failing loudly. Check the
          # things that parser is strict about, and that we cannot see fail
          # until a deploy is attempted.
          python3 -c "
          import sys, yaml
          raw = open('.cpanel.yml', 'rb').read()
          raw.decode('ascii')                     # non-ASCII is rejected
          assert b'\t' not in raw, 'tabs'
          tasks = yaml.safe_load(raw)['deployment']['tasks']
          assert tasks and all(isinstance(t, str) for t in tasks), 'tasks must be plain strings'
          assert not any('{' in t or '}' in t for t in tasks), 'braces are a YAML flow indicator'
          print(f'.cpanel.yml ok: {len(tasks)} tasks')
          "

      - name: Check tracked file modes
        run: |
          set -euo pipefail
          # The deploy sets permissions with a single 'chmod -R u=rwX,go=rX',
          # where capital X preserves an execute bit a file already carries.
          # That is only correct because every file here is mode 100644. If one
          # ever lands executable, it would be deployed executable and the
          # deploy would stop matching the 0755/0644 rule, silently.
          if git ls-files -s | awk '$1 != "100644" { print; found = 1 } END { exit !found }'; then
            echo "The files above are not mode 100644; the deploy assumes they all are." >&2
            exit 1
          fi
          echo "every tracked file is mode 100644"

      - name: Check syntax
        run: |
          set -euo pipefail
          find app bin config public tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Apply migrations
        run: php bin/migrate.php

      - name: Confirm migrations are idempotent
        run: |
          set -euo pipefail
          php bin/migrate.php | tee /tmp/second-run.txt
          grep -q 'up to date' /tmp/second-run.txt

      - name: Confirm the position seed still matches the specification
        run: php bin/gen-position-seed.php --check

      - name: Run tests
        run: php tests/run.php --strict
